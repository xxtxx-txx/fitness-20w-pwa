<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="description" content="20 周训练与饮食执行面板，支持离线和本地记录。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Fitness · 今天</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到今日计划</a>
  <header class="app-header">
    <a class="wordmark" href="./" aria-label="Fitness，回到今天"><img src="./icons/icon-192.png" alt="" width="28" height="28"><span>Fitness</span></a>
    <span id="offline-status" class="local-status" role="status">本地执行面板</span>
  </header>
  <div id="update-notice" class="update-notice" hidden><span>新版本已准备好，记录会保留。</span><button id="apply-update" type="button">更新并重载</button></div>
  <main id="main" tabindex="-1"><p class="loading">正在打开今天的计划…</p></main>
  <nav id="navigation" class="bottom-nav" aria-label="主导航" hidden></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <form method="dialog">
      <h2 id="dialog-title"></h2><p id="dialog-description"></p>
      <div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button id="dialog-confirm" class="primary" value="confirm">确认</button></div>
    </form>
  </dialog>
  <dialog id="workout-info-dialog" aria-labelledby="workout-info-title"><form method="dialog"><h2 id="workout-info-title">训练细节与本周安排</h2><div id="workout-info-content"></div><button class="primary wide" value="close">关闭说明</button></form></dialog>
  <input id="import-file" class="sr-only" type="file" accept=".json,application/json" tabindex="-1" aria-label="选择 JSON 备份">
  <noscript><section class="panel"><h1>需要启用 JavaScript</h1><p>日期计算和本地记录需要 JavaScript。启用后重新打开；无需账号或服务器接口。</p></section></noscript>
</body>
</html>
